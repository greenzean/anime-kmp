name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANIMEKMP_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANIMEKMP_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Bundle release
        env:
          ANIMEKMP_KEYSTORE_PASSWORD: ${{ secrets.ANIMEKMP_KEYSTORE_PASSWORD }}
          ANIMEKMP_KEY_ALIAS: ${{ secrets.ANIMEKMP_KEY_ALIAS }}
          ANIMEKMP_KEY_PASSWORD: ${{ secrets.ANIMEKMP_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_animekmp.serverUrl.release: ${{ secrets.ANIMEKMP_SERVER_URL_RELEASE }}
          ORG_GRADLE_PROJECT_animekmp.googleServerClientId: ${{ secrets.ANIMEKMP_GOOGLE_SERVER_CLIENT_ID }}
          ORG_GRADLE_PROJECT_animekmp.malClientId: ${{ secrets.ANIMEKMP_MAL_CLIENT_ID }}
          ORG_GRADLE_PROJECT_animekmp.malRedirectUri: ${{ secrets.ANIMEKMP_MAL_REDIRECT_URI }}
        run: ./gradlew :androidApp:bundleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: androidApp/build/outputs/bundle/release/*.aab
