name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck detekt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lint-reports
          path: |
            **/build/reports/detekt/
            **/build/reports/spotless/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :androidApp:assembleDebug :shared:allTests :composeApp:testAndroidHostTest
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: "**/build/reports/tests/"

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :server:build
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: server-test-reports
          path: server/build/reports/tests/
