naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'

style:
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
  MagicNumber:
    excludes: ['**/test/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidHostTest/**']

complexity:
  TooManyFunctions:
    excludes: ['**/test/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidHostTest/**']

